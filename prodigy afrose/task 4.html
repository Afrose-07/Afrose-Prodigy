<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real-Time Chat (Single HTML)</title>

  <!-- Tailwind (optional, for quick styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    <header class="bg-white rounded-2xl p-5 shadow mb-4">
      <h1 class="text-2xl font-bold">⚡ Real-Time Chat</h1>
      <p class="text-sm text-slate-600">Single-file HTML powered by Firebase (no custom server).</p>
      <div class="mt-3 grid gap-3 md:grid-cols-3">
        <label class="flex items-center gap-2">
          <span class="text-sm text-slate-600 w-20">Username</span>
          <input id="username" class="flex-1 border rounded-lg px-3 py-2" placeholder="e.g. Afrose" />
        </label>
        <label class="flex items-center gap-2">
          <span class="text-sm text-slate-600 w-20">Room</span>
          <input id="room" class="flex-1 border rounded-lg px-3 py-2" placeholder="general" />
        </label>
        <button id="joinBtn" class="bg-indigo-600 text-white rounded-xl px-4 py-2 hover:bg-indigo-700">Join</button>
      </div>
      <p class="text-xs text-slate-500 mt-2">Tip: Share the room name (or this page URL after joining) with friends to chat together.</p>
    </header>

    <main class="grid md:grid-cols-[1fr_260px] gap-4">
      <!-- Chat panel -->
      <section class="bg-white rounded-2xl shadow flex flex-col h-[70vh]">
        <div id="chatHeader" class="px-4 py-3 border-b text-slate-700 text-sm">Not connected</div>
        <ul id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></ul>

        <div class="p-3 border-t flex items-center gap-2">
          <input id="message" class="flex-1 border rounded-lg px-3 py-2" placeholder="Type a message…" />
          <button id="sendBtn" class="bg-emerald-600 text-white rounded-xl px-4 py-2 hover:bg-emerald-700">Send</button>
        </div>
        <div id="typing" class="px-4 pb-3 text-xs text-slate-500 h-5"></div>
      </section>

      <!-- Sidebar -->
      <aside class="bg-white rounded-2xl shadow p-4 h-[70vh] flex flex-col">
        <h2 class="font-semibold mb-2">Room Info</h2>
        <div class="text-sm text-slate-600 mb-3">
          <div>Room: <span id="roomName">—</span></div>
          <div>Your ID: <span id="myId">—</span></div>
        </div>

        <h3 class="font-semibold mt-2 mb-2">Online Users</h3>
        <ul id="users" class="flex-1 overflow-y-auto space-y-1 text-sm"></ul>

        <h3 class="font-semibold mt-4 mb-2">Options</h3>
        <button id="leaveBtn" class="text-left bg-rose-600 text-white rounded-xl px-3 py-2 hover:bg-rose-700">Leave Room</button>
      </aside>
    </main>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <script>
    /* ------------------------------ SETUP ------------------------------ *
     * 1) Create a Firebase project at https://console.firebase.google.com
     * 2) Enable: Authentication (Anonymous) and Realtime Database
     * 3) Put your web app config below.
     * ------------------------------------------------------------------ */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // UI elements
    const el = (id) => document.getElementById(id);
    const usernameInput = el('username');
    const roomInput = el('room');
    const joinBtn = el('joinBtn');
    const leaveBtn = el('leaveBtn');
    const sendBtn = el('sendBtn');
    const messageInput = el('message');
    const messagesList = el('messages');
    const usersList = el('users');
    const chatHeader = el('chatHeader');
    const typingLine = el('typing');
    const roomName = el('roomName');
    const myIdEl = el('myId');

    // State
    let me = null; // {uid, name}
    let room = null; // room name
    let presenceRef = null;
    let msgRef = null;
    let usersRef = null;
    let typingRef = null;

    // Restore saved username
    usernameInput.value = localStorage.getItem('chat_username') || '';
    // Room from URL hash if present (#room-name)
    if (location.hash && location.hash.length > 1) {
      roomInput.value = decodeURIComponent(location.hash.slice(1));
    }

    function scrollToEnd() {
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function addMessage({name, text, ts, mine}) {
      const li = document.createElement('li');
      li.className = `rounded-xl px-3 py-2 max-w-[85%] ${mine ? 'bg-emerald-100 ml-auto' : 'bg-slate-100'} `;
      const time = new Date(ts).toLocaleTimeString();
      li.innerHTML = `<div class="text-xs text-slate-500">${name} • ${time}</div><div class="text-slate-800">${escapeHtml(text)}</div>`;
      messagesList.appendChild(li);
      scrollToEnd();
    }

    function setRoomUI(joined) {
      roomName.textContent = room || '—';
      chatHeader.textContent = joined ? `Connected to "${room}"` : 'Not connected';
      if (!joined) {
        usersList.innerHTML = '';
        messagesList.innerHTML = '';
        typingLine.textContent = '';
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Typing indicators
    let typingTimeout;
    messageInput.addEventListener('input', () => {
      if (!typingRef) return;
      typingRef.set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => typingRef.set(false), 1200);
    });

    // Join room
    joinBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim() || 'Guest';
      room = roomInput.value.trim() || 'general';
      localStorage.setItem('chat_username', name);
      location.hash = encodeURIComponent(room);

      // Sign in anonymously once
      if (!auth.currentUser) {
        await auth.signInAnonymously();
      }
      me = { uid: auth.currentUser.uid, name };
      myIdEl.textContent = me.uid.slice(0, 8);

      // Paths
      const base = `rooms/${room}`;
      msgRef = db.ref(`${base}/messages`);
      usersRef = db.ref(`${base}/users`);
      typingRef = db.ref(`${base}/typing/${me.uid}`);

      // Presence (online users)
      presenceRef = usersRef.child(me.uid);
      await presenceRef.set({ name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
      presenceRef.onDisconnect().remove();

      // Show users
      usersRef.on('value', (snap) => {
        const val = snap.val() || {};
        usersList.innerHTML = '';
        Object.entries(val).forEach(([uid, u]) => {
          const li = document.createElement('li');
          li.className = 'px-2 py-1 rounded bg-slate-100';
          li.textContent = `${u.name || 'User'} (${uid.slice(0, 6)})`;
          usersList.appendChild(li);
        });
      });

      // Load last 100 messages and listen for new
      messagesList.innerHTML = '';
      msgRef.limitToLast(100).on('child_added', (snap) => {
        const m = snap.val();
        addMessage({
          name: m.name,
          text: m.text,
          ts: m.ts || Date.now(),
          mine: m.uid === me.uid
        });
      });

      // Others typing
      db.ref(`${base}/typing`).on('value', (snap) => {
        const val = snap.val() || {};
        const typingUsers = Object.entries(val)
          .filter(([uid, v]) => uid !== me.uid && v)
          .map(([uid]) => uid.slice(0, 6));
        typingLine.textContent = typingUsers.length ? `Typing: ${typingUsers.join(', ')}` : '';
      });

      setRoomUI(true);
    });

    // Send message
    sendBtn.addEventListener('click', async () => {
      const text = messageInput.value.trim();
      if (!text || !msgRef) return;
      await msgRef.push({
        uid: me.uid,
        name: me.name,
        text,
        ts: firebase.database.ServerValue.TIMESTAMP
      });
      messageInput.value = '';
      typingRef && typingRef.set(false);
    });

    // Enter key send
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // Leave room
    leaveBtn.addEventListener('click', () => {
      if (presenceRef) presenceRef.remove();
      if (msgRef) msgRef.off();
      if (usersRef) usersRef.off();
      setRoomUI(false);
    });

    // Auto-join if hash already set (after page reload)
    window.addEventListener('load', async () => {
      if (roomInput.value.trim()) {
        joinBtn.click();
      }
    });
  </script>
</body>
</html>
